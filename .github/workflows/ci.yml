name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel in-progress runs on PR push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Grant the built-in GITHUB_TOKEN read access to GitHub Packages so the
# dashboard's private @umb-advisors/llm dep (DR-25 / MBOX-136, PR #84) can be
# pulled at `npm ci` time. `contents: read` keeps checkout working under the
# narrowed permission set (declaring any permission drops the default grant).
permissions:
  contents: read
  packages: read

jobs:
  dashboard:
    name: dashboard (typecheck + test)
    runs-on: ubuntu-latest

    # Postgres service for DB-backed schema-invariants test cases.
    # Migrations are applied by the test setup step below — without that, the
    # CHECK constraints don't exist yet and the DB-backed cases would fail
    # rather than skip.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mailbox
          POSTGRES_PASSWORD: mailbox
          POSTGRES_DB: mailbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      # dashboard/.npmrc points @umb-advisors:* at npm.pkg.github.com and reads
      # the auth token from ${GITHUB_PACKAGES_TOKEN}. Supply it from the built-in
      # GITHUB_TOKEN (job grants packages: read above). Same-org token works
      # only if the @umb-advisors/llm package grants this repo read access; if
      # not, swap to a PAT secret with org-level read:packages — see MBOX-337.
      - name: Install dependencies
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      # Apply the canonical schema snapshot (captured from Bob via pg_dump).
      # The dashboard's incremental .sql migrations assume mailbox.drafts +
      # mailbox.inbox_messages already exist (created out-of-band on the
      # appliance), so they cannot bootstrap a fresh DB on their own.
      # Refresh test/fixtures/schema.sql when migrations land — see the
      # comment block at the top of that file.
      - name: Apply schema snapshot to CI Postgres
        run: |
          PGPASSWORD=mailbox psql \
            -h localhost -p 5432 -U mailbox -d mailbox \
            -v ON_ERROR_STOP=1 \
            -f test/fixtures/schema.sql

      - name: Lint + format (Biome)
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Vitest (schema invariants + pure code)
        env:
          TEST_POSTGRES_URL: postgresql://mailbox:mailbox@localhost:5432/mailbox
        run: npm test

# Deferred for follow-up commits under STAQPRO-134:
#   - Lint/format step (Biome recommended; pick + add)
#   - Workflow JSON drift check (after STAQPRO-133's drift test lands)
#   - Pipeline smoke test job (separate job; needs Ollama or mocked LLM)
